<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>StageMap — Trouve ton stage</title>
<meta name="description" content="1000+ entreprises à contacter en un clic. Message direct par mail, suivi des réponses, tout depuis une page." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='22' width='100' height='100' fill='%237C3AED'/%3E%3Cpath d='M30 62c6 7 14 10 22 10 12 0 20-7 20-17 0-9-6-13-19-16-10-2-14-4-14-9 0-5 4-8 11-8 6 0 10 2 13 7l9-6c-4-7-12-11-22-11-12 0-21 7-21 17 0 10 7 14 19 17 10 2 14 4 14 9 0 5-5 8-12 8-6 0-11-3-14-8z' fill='%23fff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://accounts.google.com" />
<style>
  :root{
    --bg:#ffffff;
    --ink:#0a0a0a;
    --ink-2:#1a1a1a;
    --muted:#6b6b6b;
    --line:#ececec;
    --line-2:#f3f3f3;
    --violet:#7C3AED;
    --violet-ink:#5b21b6;
    --violet-50:#f5f0ff;
    --violet-100:#ece2ff;
    --shadow:0 1px 2px rgba(10,10,10,.04), 0 8px 24px rgba(10,10,10,.06);
    --shadow-lg:0 20px 60px rgba(124,58,237,.18);
    --radius:16px;
    --radius-lg:22px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
  button{font:inherit;color:inherit}
  a{color:var(--violet-ink);text-decoration:none}
  input,textarea,button{font-family:inherit}

  /* ====== Shell ====== */
  .app{min-height:100vh;display:grid;grid-template-rows:auto 1fr;max-width:1180px;margin:0 auto;padding:0 24px 80px}
  header.top{display:flex;align-items:center;gap:18px;padding:22px 0 18px;position:sticky;top:0;background:linear-gradient(to bottom,var(--bg) 70%, rgba(255,255,255,.7));backdrop-filter:blur(10px);z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.02em;font-size:18px}
  .brand .logo{width:28px;height:28px;border-radius:9px;background:var(--violet);display:grid;place-items:center;color:#fff;font-weight:900}
  .brand small{color:var(--muted);font-weight:500;margin-left:4px;font-size:12px;letter-spacing:.02em}
  nav.tabs{display:flex;gap:4px;margin-left:12px;padding:4px;background:#f6f6f7;border-radius:12px}
  nav.tabs button{background:transparent;border:0;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600;letter-spacing:-.01em;transition:all .15s ease}
  nav.tabs button.active{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .spacer{flex:1}
  .user-pill{display:flex;align-items:center;gap:10px;padding:5px 12px 5px 5px;border:1px solid var(--line);border-radius:999px;background:#fff}
  .user-pill img{width:28px;height:28px;border-radius:50%;object-fit:cover;background:#eee}
  .user-pill .u-name{font-weight:600;font-size:13px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .user-pill .u-out{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:4px 6px;border-radius:6px}
  .user-pill .u-out:hover{background:#f6f6f7}

  /* ====== Sign-in gate ====== */
  .gate{display:grid;place-items:center;min-height:68vh;padding:40px 0}
  .gate-card{max-width:520px;text-align:center;padding:40px 36px;border-radius:var(--radius-lg);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow)}
  .gate h1{font-size:34px;letter-spacing:-.03em;margin:4px 0 10px;line-height:1.1}
  .gate h1 em{color:var(--violet);font-style:normal}
  .gate p{color:var(--muted);margin:0 0 24px}
  .gate .gbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 18px;border-radius:12px;background:#fff;color:#0a0a0a;border:1px solid var(--line);cursor:pointer;font-weight:600;width:100%;font-size:14px;transition:background .15s ease,border-color .15s ease}
  .gate .gbtn:hover{background:#f6f6f7;border-color:#d9d9d9}
  .gate .gbtn svg{width:18px;height:18px}
  .gate .fineprint{margin-top:18px;font-size:12px;color:var(--muted);line-height:1.6}
  .gate .fineprint code{background:#f6f6f7;padding:1px 6px;border-radius:5px;font-size:11px}

  /* ====== Login form ====== */
  .login-form{display:flex;flex-direction:column;gap:10px;text-align:left}
  .login-form label{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:-6px}
  .login-form input{padding:11px 13px;border:1px solid var(--line);border-radius:12px;outline:0;font-size:14px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease;font-family:inherit}
  .login-form input:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-50)}
  .login-form .login-submit{margin-top:8px;padding:12px 18px;background:var(--violet);color:#fff;border:0;border-radius:12px;cursor:pointer;font-weight:700;font-size:15px;letter-spacing:-.01em;transition:background .15s ease}
  .login-form .login-submit:hover{background:var(--violet-ink)}
  .login-err{min-height:16px;font-size:13px;color:#dc2626;text-align:center;margin-top:-4px}
  .divider{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ====== Section header ====== */
  .section-head{display:flex;align-items:end;justify-content:space-between;margin:28px 0 14px}
  .section-head h2{margin:0;font-size:24px;letter-spacing:-.025em}
  .section-head .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .section-head .btn-ghost{background:transparent;border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;color:var(--ink)}
  .section-head .btn-ghost:hover{border-color:#d9d9d9}

  /* ====== Search ====== */
  .searchbar{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);transition:border-color .15s ease,box-shadow .15s ease}
  .searchbar:focus-within{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-50)}
  .searchbar input{flex:1;border:0;outline:0;padding:6px 2px;background:transparent;font-size:15px}
  .searchbar .k{padding:2px 8px;background:#f6f6f7;border-radius:6px;color:var(--muted);font-size:12px}
  .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  .filters button{border:1px solid var(--line);background:#fff;padding:7px 12px;border-radius:999px;font-size:13px;color:var(--muted);cursor:pointer;font-weight:500}
  .filters button.on{background:var(--violet);color:#fff;border-color:var(--violet)}

  /* ====== Grid of companies ====== */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:4px}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;display:flex;flex-direction:column;gap:12px;transition:transform .12s ease,box-shadow .12s ease,border-color .12s ease;cursor:pointer}
  .card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#e4e4e7}
  .card .head{display:flex;gap:12px;align-items:center}
  .card .avatar{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;letter-spacing:-.02em;font-size:16px;flex:0 0 auto}
  .card .meta{min-width:0;flex:1}
  .card .name{font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .sub{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px}
  .card .tag{background:var(--violet-50);color:var(--violet-ink);border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
  .card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:8px}
  .card .mail{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .send{background:var(--ink);color:#fff;border:0;padding:8px 12px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;flex:0 0 auto}
  .card .send:hover{background:var(--violet)}

  /* ====== Messages ====== */
  .msg-wrap{display:grid;grid-template-columns:320px 1fr;gap:16px;min-height:520px;margin-top:4px}
  .threads{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .threads .th-head{padding:12px 14px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between}
  .threads .th-head strong{font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
  .threads .th-head button{border:0;background:var(--violet-50);color:var(--violet-ink);border-radius:8px;padding:4px 8px;cursor:pointer;font-weight:600;font-size:12px}
  .threads ul{list-style:none;margin:0;padding:0;max-height:620px;overflow:auto}
  .threads li{padding:12px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;display:flex;gap:10px}
  .threads li:hover{background:#fafafa}
  .threads li.sel{background:var(--violet-50)}
  .threads li .av{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
  .threads li .tx{min-width:0;flex:1}
  .threads li .tx .n{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .threads li .tx .p{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .threads li .tx .d{font-size:11px;color:var(--muted);margin-top:2px}
  .threads li .dot{width:8px;height:8px;background:var(--violet);border-radius:50%;margin-top:14px}

  .chat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);display:flex;flex-direction:column;min-height:520px}
  .chat .ch-head{padding:14px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:12px}
  .chat .ch-head .av{width:40px;height:40px;border-radius:12px;color:#fff;display:grid;place-items:center;font-weight:800}
  .chat .ch-head .n{font-weight:700}
  .chat .ch-head .m{color:var(--muted);font-size:12.5px}
  .chat .body{flex:1;padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px;background:#fafafa}
  .chat .bubble{max-width:72%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.45;box-shadow:0 1px 1px rgba(10,10,10,.04);white-space:pre-wrap;word-wrap:break-word}
  .chat .bubble.me{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:4px}
  .chat .bubble.them{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:4px}
  .chat .bubble .ts{display:block;margin-top:4px;font-size:10.5px;opacity:.7}
  .chat .empty{flex:1;display:grid;place-items:center;color:var(--muted);padding:40px;text-align:center}
  .chat .composer{border-top:1px solid var(--line-2);padding:12px;display:flex;gap:10px;align-items:flex-end}
  .chat textarea{flex:1;border:1px solid var(--line);border-radius:12px;padding:10px 12px;resize:none;outline:0;min-height:44px;max-height:160px;font-size:14px;transition:border-color .15s ease,box-shadow .15s ease}
  .chat textarea:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-50)}
  .chat .send-btn{background:var(--violet);color:#fff;border:0;border-radius:12px;padding:0 18px;height:44px;cursor:pointer;font-weight:700;letter-spacing:-.01em}
  .chat .send-btn:disabled{opacity:.4;cursor:not-allowed}

  /* ====== Compose modal ====== */
  .modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.5);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
  .modal-bg.on{display:flex}
  .modal{background:#fff;border-radius:var(--radius-lg);padding:26px;width:min(560px,100%);box-shadow:var(--shadow-lg)}
  .modal h3{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
  .modal p{margin:0 0 20px;color:var(--muted);font-size:13.5px}
  .modal label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:14px 0 6px;letter-spacing:.02em;text-transform:uppercase}
  .modal input,.modal textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;outline:0;font-size:14px;transition:border-color .15s ease,box-shadow .15s ease;background:#fff}
  .modal input:focus,.modal textarea:focus{border-color:var(--violet);box-shadow:0 0 0 4px var(--violet-50)}
  .modal textarea{min-height:160px;resize:vertical;font-family:inherit}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
  .modal .cancel{background:#fff;border:1px solid var(--line);color:var(--ink);padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600}
  .modal .ok{background:var(--violet);color:#fff;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:700}
  .modal .ok:disabled{opacity:.5;cursor:not-allowed}

  /* ====== Toast ====== */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#0a0a0a;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:all .25s ease;z-index:200;font-size:14px;font-weight:500;pointer-events:none}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ====== Pages ====== */
  .page{display:none}
  .page.on{display:block}
  .empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
  .empty-state .icon{font-size:36px;margin-bottom:10px}

  /* Responsive */
  @media (max-width:820px){
    .msg-wrap{grid-template-columns:1fr}
    .msg-wrap.chat-open .threads{display:none}
    .msg-wrap:not(.chat-open) .chat{display:none}
    header.top{flex-wrap:wrap;gap:10px}
    nav.tabs{order:3;width:100%;margin-left:0;overflow-x:auto}
    nav.tabs button{white-space:nowrap}
    .gate h1{font-size:26px}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>

<!-- Compose modal -->
<div class="modal-bg" id="composeBg">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 id="cmp-title">Contacter l'entreprise</h3>
    <p id="cmp-sub">Le mail part de ton adresse Gmail. Les réponses reviendront dans ta boîte et apparaîtront ici.</p>
    <label>Objet</label>
    <input id="cmp-subj" type="text" placeholder="Candidature stage — [Ton nom]" />
    <label>Message</label>
    <textarea id="cmp-body" placeholder="Bonjour, …"></textarea>
    <div class="actions">
      <button class="cancel" id="cmp-cancel">Annuler</button>
      <button class="ok" id="cmp-send">Ouvrir dans Gmail</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="companies.js" defer></script>
<script>
/* ============================================================
   CONFIG — remplace par ton OAuth Client ID Google
   ============================================================ */
const GOOGLE_CLIENT_ID = window.STAGEMAP_CLIENT_ID || "282284471657-k9jnchb8il4kfp8bs20kbhafsrt0m23k.apps.googleusercontent.com";
const GMAIL_SCOPES = "openid email profile";

/* ============================================================
   COMPANIES — 1000+ entreprises FR avec mails recrutement publics / patterns standards
   À étendre dans COMPANIES
   ============================================================ */
const COMPANIES = (window.COMPANIES || []);
/* Palette d'accent par entreprise — déterminée à partir du nom */
const AV_COLORS = ["#7C3AED","#0a0a0a","#2563eb","#0ea5e9","#ec4899","#f59e0b","#10b981","#8b5cf6","#ef4444","#64748b"];
function avatarColor(name){
  let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))|0;
  return AV_COLORS[Math.abs(h)%AV_COLORS.length];
}
function initials(name){
  return name.replace(/[^a-zA-Z0-9À-ÿ ]/g,"").split(/\s+/).filter(Boolean).slice(0,2).map(s=>s[0].toUpperCase()).join("");
}

/* ============================================================
   STATE
   ============================================================ */
const state = {
  user: null,        // {email, name, picture, token}
  tab: "discover",   // discover | search | messages
  search: "",
  filter: "Tous",
  randomPool: [],
  threads: new Map(), // key=companyEmail → {company, messages[]}
  selectedThread: null,
  pollTimer: null
};

/* ============================================================
   UI RENDER
   ============================================================ */
const $app = document.getElementById("app");
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){
    if(k==="class")e.className=attrs[k];
    else if(k==="html")e.innerHTML=attrs[k];
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),attrs[k]);
    else e.setAttribute(k,attrs[k]);
  }
  for(const k of kids){
    if(k==null||k===false)continue;
    e.appendChild(typeof k==="string"?document.createTextNode(k):k);
  }
  return e;
}
function renderTopBar(){
  const bar = el("header",{class:"top"},
    el("div",{class:"brand"},
      el("div",{class:"logo"},"S"),
      "StageMap",
      el("small",{},"· 1000+ entreprises")
    )
  );
  if(state.user){
    const tabs = el("nav",{class:"tabs"},
      tabBtn("discover","Découvrir"),
      tabBtn("search","Rechercher"),
      tabBtn("messages","Messages")
    );
    bar.appendChild(tabs);
    bar.appendChild(el("div",{class:"spacer"}));
    const pill = el("div",{class:"user-pill"},
      el("img",{src:state.user.picture||"",alt:""}),
      el("span",{class:"u-name"},state.user.name||state.user.email),
      el("button",{class:"u-out",title:"Déconnexion",onClick:signOut},"⌄")
    );
    bar.appendChild(pill);
  }
  return bar;
}
function tabBtn(id,label){
  return el("button",{
    class:state.tab===id?"active":"",
    onClick:()=>{state.tab=id;render();}
  },label);
}
function renderGate(){
  const form = el("form",{class:"login-form",onSubmit:handleLoginSubmit},
    el("label",{for:"login-email"},"Email"),
    el("input",{type:"email",id:"login-email",required:"required",autocomplete:"email",placeholder:"toi@exemple.com"}),
    el("label",{for:"login-name"},"Prénom (pour tes mails)"),
    el("input",{type:"text",id:"login-name",required:"required",autocomplete:"given-name",placeholder:"Arthur"}),
    el("label",{for:"login-password"},"Mot de passe"),
    el("input",{type:"password",id:"login-password",required:"required",autocomplete:"current-password",placeholder:"6 caractères min.",minlength:"6"}),
    el("div",{class:"login-err",id:"login-err"}),
    el("button",{type:"submit",class:"login-submit"},"Se connecter / S'inscrire")
  );
  const card = el("div",{class:"gate-card"},
    el("div",{class:"brand",style:"justify-content:center;margin-bottom:12px"},
      el("div",{class:"logo"},"S")
    ),
    el("h1",{html:"Trouve ton <em>stage</em> parmi 1000+ entreprises."}),
    form,
    el("div",{class:"divider"},el("span",{},"ou")),
    el("button",{class:"gbtn",onClick:signInGoogleRedirect,type:"button"},
      el("span",{html:'<svg viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.4h6.5c-.3 1.5-1.1 2.8-2.4 3.7v3.1h3.9c2.3-2.1 3.5-5.2 3.5-8.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-2.9l-3.9-3.1c-1.1.7-2.5 1.2-4.1 1.2-3.2 0-5.9-2.1-6.8-5.1H1.2v3.2C3.2 21.4 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.1c-.2-.7-.4-1.4-.4-2.1s.1-1.5.4-2.1V6.7H1.2C.4 8.3 0 10.1 0 12s.4 3.7 1.2 5.3l4-3.2z"/><path fill="#EA4335" d="M12 4.8c1.8 0 3.4.6 4.6 1.8l3.5-3.5C17.9 1.2 15.2 0 12 0 7.3 0 3.2 2.6 1.2 6.7l4 3.2C6.1 6.9 8.8 4.8 12 4.8z"/></svg>'}),
      "Continuer avec Google"
    ),
    el("div",{class:"fineprint"},
      "Première fois ? Email/mdp crée ton compte localement (sauvé dans ton navigateur). Google = login en 1 clic."
    )
  );
  setTimeout(()=>{document.getElementById("login-email")?.focus();},50);
  return el("div",{class:"gate"},card);
}
function signInGoogleRedirect(){
  const nonce = (crypto.randomUUID ? crypto.randomUUID() : Date.now()+"-"+Math.random());
  sessionStorage.setItem("stagemap_nonce", nonce);
  const params = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    response_type: "id_token",
    scope: "openid email profile",
    redirect_uri: window.location.origin + "/",
    nonce: nonce,
    state: "stagemap",
    prompt: "select_account"
  });
  window.location.href = "https://accounts.google.com/o/oauth2/v2/auth?" + params.toString();
}
function parseGoogleCallback(){
  if(!window.location.hash || window.location.hash.length < 2) return false;
  const hash = new URLSearchParams(window.location.hash.substring(1));
  const idToken = hash.get("id_token");
  const errorG = hash.get("error");
  if(errorG){
    console.error("Google error:", errorG);
    alert("Erreur Google : " + errorG);
    window.history.replaceState({}, "", window.location.pathname);
    return false;
  }
  if(!idToken) return false;
  try {
    const parts = idToken.split(".");
    const b64 = parts[1].replace(/-/g,"+").replace(/_/g,"/");
    const padded = b64 + "=".repeat((4 - b64.length % 4) % 4);
    const json = decodeURIComponent(atob(padded).split("").map(c=>"%"+("00"+c.charCodeAt(0).toString(16)).slice(-2)).join(""));
    const payload = JSON.parse(json);
    const expectedNonce = sessionStorage.getItem("stagemap_nonce");
    if(expectedNonce && payload.nonce && payload.nonce !== expectedNonce){
      console.warn("Nonce mismatch");
    }
    sessionStorage.removeItem("stagemap_nonce");
    state.user = {email: payload.email, name: payload.name || payload.given_name || payload.email.split("@")[0], picture: payload.picture || ""};
    localStorage.setItem("stagemap_user", JSON.stringify(state.user));
    window.history.replaceState({}, "", window.location.pathname);
    return true;
  } catch(e) {
    console.error(e);
    alert("Erreur lors de la lecture du token Google.");
    return false;
  }
}
async function sha256Hex(str){
  const buf = new TextEncoder().encode(str);
  const hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function handleLoginSubmit(e){
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim().toLowerCase();
  const name = document.getElementById("login-name").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-err");
  errEl.textContent = "";
  if(!email || !name || !password){errEl.textContent="Remplis tout.";return;}
  if(password.length < 6){errEl.textContent="Mot de passe trop court (6 min.).";return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){errEl.textContent="Email invalide.";return;}
  try {
    const hash = await sha256Hex(password + "::" + email);
    const usersKey = "stagemap_users";
    const users = JSON.parse(localStorage.getItem(usersKey) || "{}");
    if(users[email]){
      if(users[email].pwd !== hash){errEl.textContent="Mauvais mot de passe pour cet email.";return;}
      // Met à jour le nom si changé
      if(name && users[email].name !== name){users[email].name = name; localStorage.setItem(usersKey, JSON.stringify(users));}
    } else {
      users[email] = {pwd: hash, name, createdAt: Date.now()};
      localStorage.setItem(usersKey, JSON.stringify(users));
    }
    state.user = {email, name, picture: ""};
    localStorage.setItem("stagemap_user", JSON.stringify(state.user));
    loadThreadsFromStorage();
    render();
    toast("Connecté ✓");
  } catch(err) {
    errEl.textContent = "Erreur : " + (err.message || err);
    console.error(err);
  }
}

/* ===== Discover (random pool) ===== */
function freshRandom(n=12){
  const arr=[...COMPANIES];
  for(let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr.slice(0,n);
}
function renderDiscover(){
  if(state.randomPool.length===0)state.randomPool=freshRandom(12);
  const grid = el("div",{class:"grid"}, ...state.randomPool.map(companyCard));
  return el("section",{class:"page on"},
    el("div",{class:"section-head"},
      el("div",{},
        el("h2",{},"Découvrir au hasard"),
        el("div",{class:"sub"},"Un panel d'entreprises piochées au hasard. Clique sur "),
      ),
      el("button",{class:"btn-ghost",onClick:()=>{state.randomPool=freshRandom(12);render();}},"Nouveau tirage")
    ),
    grid
  );
}

/* ===== Search ===== */
const CATS = ["Tous","Tech","Luxe","Banque","Conseil","Média","Jeux vidéo","Énergie","Santé","Retail","Aéronautique","Auto"];
function matchFilter(c,f){
  if(f==="Tous")return true;
  const x=c.c.toLowerCase();
  const map={"Tech":"tech","Luxe":"luxe","Banque":"banque","Conseil":"conseil","Média":"média","Jeux vidéo":"jeux","Énergie":"énergie","Santé":"santé","Retail":"retail","Aéronautique":"aéronautique","Auto":"automobile"};
  return x.includes(map[f]||f.toLowerCase());
}
function renderSearch(){
  const bar = el("div",{class:"searchbar"},
    el("span",{html:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#6b6b6b" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="#6b6b6b" stroke-width="2" stroke-linecap="round"/></svg>'}),
    el("input",{type:"text",placeholder:"Nom d'entreprise, secteur, ville…",value:state.search,oninput:e=>{state.search=e.target.value;renderPage();}}),
    el("span",{class:"k"},"⌘K")
  );
  const filters = el("div",{class:"filters"},
    ...CATS.map(c=>el("button",{class:state.filter===c?"on":"",onClick:()=>{state.filter=c;renderPage();}},c))
  );
  const q=state.search.trim().toLowerCase();
  const results = COMPANIES.filter(c=>matchFilter(c,state.filter)).filter(c=>{
    if(!q)return true;
    return c.n.toLowerCase().includes(q) || c.c.toLowerCase().includes(q) || c.v.toLowerCase().includes(q);
  });
  const grid = results.length
    ? el("div",{class:"grid"}, ...results.map(companyCard))
    : el("div",{class:"empty-state"}, el("div",{class:"icon"},"🔍"), el("div",{},"Aucun résultat."));
  return el("section",{class:"page on"},
    el("div",{class:"section-head"},
      el("div",{},
        el("h2",{},"Rechercher"),
        el("div",{class:"sub"},`${results.length} entreprise(s)`)
      )
    ),
    bar, filters, grid
  );
}

/* ===== Messages ===== */
function renderMessages(){
  const threadsArr = [...state.threads.values()].sort((a,b)=>(b.lastTs||0)-(a.lastTs||0));
  const list = el("ul",{});
  if(threadsArr.length===0){
    list.appendChild(el("li",{style:"color:#6b6b6b;cursor:default;justify-content:center;padding:28px 14px"},el("div",{class:"tx"},"Aucune conversation. Envoie un premier message.")));
  }
  for(const t of threadsArr){
    const sel = state.selectedThread && state.selectedThread.company.m===t.company.m;
    const preview = t.messages[t.messages.length-1];
    list.appendChild(el("li",{
      class:sel?"sel":"",
      onClick:()=>{state.selectedThread=t;render();}
    },
      el("div",{class:"av",style:`background:${avatarColor(t.company.n)}`},initials(t.company.n)),
      el("div",{class:"tx"},
        el("div",{class:"n"},t.company.n),
        el("div",{class:"p"},(preview?preview.body.slice(0,60):"…")),
        el("div",{class:"d"}, preview ? timeAgo(preview.ts) : "")
      ),
      t.unread?el("div",{class:"dot"}):null
    ));
  }
  const threads = el("div",{class:"threads"},
    el("div",{class:"th-head"},
      el("strong",{},"Conversations"),
      el("button",{onClick:gmailSyncManual},"Actualiser")
    ),
    list
  );
  let chat;
  if(state.selectedThread){
    const t=state.selectedThread;
    const body=el("div",{class:"body"});
    for(const m of t.messages){
      const b = el("div",{class:"bubble "+(m.from==="me"?"me":"them")}, m.body);
      b.appendChild(el("span",{class:"ts"}, new Date(m.ts).toLocaleString("fr-FR",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"short"})));
      body.appendChild(b);
    }
    const ta=el("textarea",{placeholder:"Écris ta réponse…",rows:1});
    ta.addEventListener("input",()=>{ta.style.height="auto";ta.style.height=Math.min(160,ta.scrollHeight)+"px";});
    const sendBtn=el("button",{class:"send-btn",onClick:async()=>{
      const v=ta.value.trim();if(!v)return;
      sendBtn.disabled=true;
      await replyInThread(t,v);
      ta.value="";ta.style.height="auto";
      sendBtn.disabled=false;
    }},"Envoyer");
    chat = el("div",{class:"chat"},
      el("div",{class:"ch-head"},
        el("div",{class:"av",style:`background:${avatarColor(t.company.n)}`},initials(t.company.n)),
        el("div",{},
          el("div",{class:"n"},t.company.n),
          el("div",{class:"m"},t.company.m)
        )
      ),
      body,
      el("div",{class:"composer"}, ta, sendBtn)
    );
    setTimeout(()=>{body.scrollTop=body.scrollHeight;},0);
  } else {
    chat = el("div",{class:"chat"},
      el("div",{class:"empty"},
        el("div",{},
          el("div",{style:"font-size:36px;margin-bottom:10px"},"✉️"),
          el("div",{},"Sélectionne une conversation."),
          el("div",{style:"font-size:12.5px;margin-top:6px;color:#9a9a9a"},"Ou retourne sur Découvrir pour contacter une entreprise.")
        )
      )
    );
  }
  return el("section",{class:"page on"},
    el("div",{class:"section-head"},
      el("div",{},
        el("h2",{},"Messages"),
        el("div",{class:"sub"},"Les réponses pertinentes sont rattachées à l'entreprise que tu as contactée.")
      ),
      el("button",{class:"btn-ghost",onClick:gmailSyncManual},"Synchroniser Gmail")
    ),
    el("div",{class:"msg-wrap "+(state.selectedThread?"chat-open":"")}, threads, chat)
  );
}

function timeAgo(ts){
  const s=(Date.now()-ts)/1000;
  if(s<60)return "à l'instant";
  if(s<3600)return Math.floor(s/60)+" min";
  if(s<86400)return Math.floor(s/3600)+" h";
  return Math.floor(s/86400)+" j";
}

/* ===== Page render ===== */
let pageHostEl=null;
function renderPage(){
  if(!pageHostEl)return;
  pageHostEl.innerHTML="";
  const page = state.tab==="discover"?renderDiscover()
              :state.tab==="search"?renderSearch()
              :renderMessages();

function render(){
  $app.innerHTML="";
  $app.appendChild(renderTopBar());

/* ============================================================
   AUTH — mail+mdp local + Google via redirect
   ============================================================ */
function signOut(){
  localStorage.removeItem("stagemap_user");
  state.user=null;state.threads=new Map();state.selectedThread=null;
  render();
}

/* ============================================================
   THREADS persistence
   ============================================================ */
function saveThreads(){
  if(!state.user)return;
  const obj={};
  for(const [k,v] of state.threads){obj[k]={company:v.company,messages:v.messages,lastTs:v.lastTs,unread:v.unread};}
  localStorage.setItem("stagemap_threads_"+state.user.email, JSON.stringify(obj));
}
function loadThreadsFromStorage(){
  const raw=localStorage.getItem("stagemap_threads_"+state.user.email);
  if(!raw){state.threads=new Map();return;}
  try{
    const obj=JSON.parse(raw);
    state.threads=new Map();
    for(const k in obj)state.threads.set(k,obj[k]);
  }catch{state.threads=new Map();}
}
function thread(company){
  let t = state.threads.get(company.m);
  if(!t){
    t={company, messages:[], lastTs:0, unread:false};
    state.threads.set(company.m, t);
  }
  return t;
}

/* ============================================================
   COMPOSE
   ============================================================ */
let composeTarget=null;
function openCompose(company){
  if(!state.user){toast("Connecte-toi d'abord.");return;}
  composeTarget = company;
  document.getElementById("cmp-title").textContent = "Écrire à "+company.n;
  document.getElementById("cmp-sub").textContent = `Gmail s'ouvrira pré-rempli (${state.user.email} → ${company.m}). Tu cliques Envoyer et c'est parti.`;
  const subj = document.getElementById("cmp-subj");
  const body = document.getElementById("cmp-body");
  subj.value = `Candidature stage — ${state.user.name||""}`.trim();
  body.value = `Bonjour,

Je suis ${state.user.name||""}, actuellement en recherche de stage. Votre entreprise, ${company.n}, m'intéresse pour [...].

Je serais ravi(e) d'échanger sur les opportunités de stage que vous pourriez proposer.

Vous trouverez ci-joint mon CV.

Cordialement,
${state.user.name||""}`;
  document.getElementById("composeBg").classList.add("on");
}
function closeCompose(){document.getElementById("composeBg").classList.remove("on");composeTarget=null;}
document.getElementById("cmp-cancel").addEventListener("click",closeCompose);
document.getElementById("cmp-send").addEventListener("click",async()=>{
  if(!composeTarget||!state.user)return;
  const subj=document.getElementById("cmp-subj").value.trim()||"(sans objet)";
  const body=document.getElementById("cmp-body").value.trim();
  if(!body){toast("Le message est vide.");return;}
  const btn=document.getElementById("cmp-send");btn.disabled=true;btn.textContent="Ouverture Gmail…";
  try{
    await gmailSend(composeTarget.m, subj, body);
    const t=thread(composeTarget);
    t.messages.push({from:"me", body:`Objet : ${subj}\n\n${body}`, ts:Date.now()});
    t.lastTs=Date.now();
    saveThreads();
    closeCompose();
    toast("Gmail ouvert. Vérifie et clique Envoyer.");
    state.tab="messages";state.selectedThread=t;render();
  }catch(e){
    console.error(e);
    toast("Échec : "+(e.message||"erreur"));
  }finally{
    btn.disabled=false;btn.textContent="Ouvrir dans Gmail";
  }
});

async function replyInThread(t, textBody){
  const subj=`Re: Candidature stage — ${state.user.name||""}`.trim();
  try{
    await gmailSend(t.company.m, subj, textBody);
    t.messages.push({from:"me",body:textBody,ts:Date.now()});
    t.lastTs=Date.now();
    saveThreads();render();toast("Gmail ouvert.");
  }catch(e){toast("Échec : "+(e.message||"erreur"));}
}

/* ============================================================
   GMAIL API — send & list
   ============================================================ */
function b64url(str){
  const utf8 = new TextEncoder().encode(str);
  let bin="";utf8.forEach(b=>bin+=String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function gmailSend(to, subject, body){
  if(!state.user)throw new Error("Pas connecté");
  const from = state.user.email;
  const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&tf=1&source=mailto&to=${encodeURIComponent(to)}&su=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}&authuser=${encodeURIComponent(from)}`;
  window.open(gmailUrl, "_blank", "noopener");
  return { opened: true };
}
async function gmailSyncManual(){
  toast("Les réponses arrivent directement dans ton Gmail (onglet 'Reçus').");
}
function startGmailPolling(){ /* no-op : Gmail API désactivé */ }

/* ============================================================
   Toast
   ============================================================ */
let toastTimer=null;
function toast(txt){
  const t=document.getElementById("toast");t.textContent=txt;t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("on"),3000);
}

/* ============================================================
   Keyboard
   ============================================================ */
document.addEventListener("keydown",e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==="k"){e.preventDefault();state.tab="search";render();setTimeout(()=>{document.querySelector(".searchbar input")?.focus();},50);}
  if(e.key==="Escape"){closeCompose();}
});

/* ============================================================
   Bootstrap
   ============================================================ */
(function boot(){
  // 1) Callback Google après redirect
  if(parseGoogleCallback()){
    loadThreadsFromStorage();
    render();
    return;
  }
  // 2) Session locale cachée
  const cached = localStorage.getItem("stagemap_user");
  if(cached){
    try{
      const u = JSON.parse(cached);
      if(u && u.email){
        state.user = u;
        loadThreadsFromStorage();
      }
    }catch{}
  }
  render();
})();
